[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnwarden"
version = "0.1.0"
description = "CLI tool for automated vulnerability triage and remediation generation powered by a local LLM (Ollama)"
readme = "README.md"
authors = [
    { name = "0xBrdn" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
vulnwarden = "vulnwarden.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnwarden"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]